<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <nav class="nav" aria-label="Dashboard">
      <a href="/" data-view="home">Home</a>
      <a href="/agents" data-view="agents">Agents</a>
      <a href="/routines" data-view="routines">Routines</a>
      <a href="/focus" data-view="focus">Focus</a>
      <a href="/brief" data-view="brief">Daily Brief</a>
    </nav>
    <main id="content" class="content" tabindex="-1">
      <div class="notice" id="shell-notice" role="status" hidden>
        <span>The dashboard is not responding.</span>
        <button type="button" data-action="retry">Retry</button>
      </div>

      <section class="view home" id="view-home" data-view="home" aria-label="Home">
        <ul class="destinations">
          <li>
            <a class="destination" href="/agents">
              <span class="destination-name">Agents</span>
              <span class="destination-meta" id="home-agents"></span>
            </a>
          </li>
          <li>
            <a class="destination" href="/routines">
              <span class="destination-name">Routines</span>
              <span class="destination-meta" id="home-routines"></span>
            </a>
          </li>
          <li>
            <a class="destination" href="/focus">
              <span class="destination-name">Focus</span>
              <span class="destination-meta" id="home-focus"></span>
            </a>
          </li>
          <li>
            <a class="destination" href="/brief">
              <span class="destination-name">Daily Brief</span>
              <span class="destination-meta" id="home-brief"></span>
            </a>
          </li>
        </ul>
      </section>

      <section class="view routines" id="view-routines" data-view="routines" aria-label="Routines" hidden>
        <div class="routines-header">
          <div class="routines-title">
            <h1 class="routines-heading">Routines</h1>
            <p class="routines-updated" id="routines-updated"></p>
          </div>
          <button type="button" class="button" id="routines-refresh">Refresh</button>
        </div>
        <p class="routines-message" id="routines-message" hidden></p>
        <div class="routines-cards" id="routines-cards"></div>
      </section>

      <section class="view agents" id="view-agents" data-view="agents" aria-label="Agents" hidden>
        <div class="agents-list" id="agents-list">
          <h1 class="agents-heading">Agents</h1>
          <p class="agents-message" id="agents-message" hidden></p>
          <div id="agents-groups"></div>
        </div>
        <div class="agent-thread" id="agent-thread">
          <p class="thread-empty" id="agent-empty"></p>
          <div class="thread-panel" id="agent-panel" hidden>
            <div class="thread-header">
              <a class="thread-back" id="agent-back" href="/agents">All agents</a>
              <div class="thread-title">
                <h2 class="thread-name" id="agent-name"></h2>
                <span class="thread-chips" id="agent-chips"></span>
                <span class="thread-cost" id="agent-cost"></span>
              </div>
              <button type="button" class="button thread-new" id="agent-new-thread" data-agent-action="new-thread">New thread</button>
            </div>
            <div class="thread-confirm" id="agent-confirm" role="group" aria-label="New thread" hidden>
              <span id="agent-confirm-text">Start a new thread? The persona will not remember this one.</span>
              <button type="button" class="button button-primary" data-agent-action="confirm-new-thread">Start new thread</button>
              <button type="button" class="button" data-agent-action="cancel-new-thread">Cancel</button>
            </div>
            <p class="thread-description" id="agent-description" hidden></p>
            <p class="thread-notice" id="agent-notice" role="status" hidden></p>
            <div class="thread-messages" id="agent-messages" aria-live="polite"></div>
            <div class="thread-status" id="agent-status" role="status" tabindex="-1" hidden>
              <span id="agent-status-text"></span>
              <button type="button" class="button" data-agent-action="interrupt">Interrupt</button>
            </div>
            <div class="thread-request" id="agent-request" hidden></div>
            <form class="composer" id="agent-composer" hidden>
              <label class="composer-label" id="agent-input-label" for="agent-input"></label>
              <div class="composer-row">
                <textarea class="composer-input" id="agent-input" rows="2"></textarea>
                <button type="submit" class="button button-primary" id="agent-send">Send</button>
              </div>
              <p class="composer-reason" id="agent-composer-reason" hidden></p>
              <p class="composer-failure" id="agent-failure" role="status" hidden></p>
            </form>
          </div>
        </div>
      </section>

      <section class="view" id="view-focus" data-view="focus" aria-label="Focus" hidden>
        <div class="notice" id="focus-notice" role="status" hidden>
          <span>Focus is not responding.</span>
          <button type="button" data-action="retry">Retry</button>
        </div>
        <div class="frame-slot" id="focus-slot"></div>
      </section>

      <section class="view" id="view-brief" data-view="brief" aria-label="Daily Brief" hidden>
        <div class="notice" id="brief-newer" role="status" hidden>
          <span>A newer brief is available.</span>
          <button type="button" data-action="load-newer">Load newer brief</button>
        </div>
        <div class="notice" id="brief-notice" role="status" hidden>
          <span id="brief-notice-text"></span>
          <button type="button" data-action="retry">Retry</button>
        </div>
        <div class="frame-slot" id="brief-slot"></div>
      </section>
    </main>
  </div>
  <script src="/assets/routines.js"></script>
  <script src="/assets/agents.js"></script>
  <script src="/assets/shell.js"></script>
</body>
</html>
