# Factory caller: delegates to the reusable jobs in hunterphillips/agent-harness.
# Written by scripts/enroll-repo.sh in that repo; edit there, re-run to refresh.
name: factory
on:
  issues:
    types: [opened, labeled]
  # The factory starts the next part of a split issue this way.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue for the implement job
        required: true
        type: number
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
  id-token: write
jobs:
  triage:
    if: github.repository == 'hunterphillips/personal-assistant' && github.event_name == 'issues' && github.event.action == 'opened' && github.actor != 'claude[bot]'
    uses: hunterphillips/agent-harness/.github/workflows/factory.yml@main
    with:
      job: triage
      issue_number: ${{ github.event.issue.number }}
    secrets: inherit
  implement:
    if: >-
      github.repository == 'hunterphillips/personal-assistant' && (
      github.event_name == 'workflow_dispatch' || (
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready-for-agent' &&
      github.actor != 'claude[bot]'))
    uses: hunterphillips/agent-harness/.github/workflows/factory.yml@main
    with:
      job: implement
      model: claude-opus-5-5
      issue_number: ${{ github.event.issue.number || fromJSON(inputs.issue_number || '0') }}   # dispatch inputs arrive as strings
    secrets: inherit
